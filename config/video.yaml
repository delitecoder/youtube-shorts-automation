# Video production defaults (studio.video).
canvas:
  short: {w: 1080, h: 1920}
  long: {w: 1920, h: 1080}
fps: 30
engines: [hyperframes, pillow]     # blender is optional and only per scene when the budget allows
qc:
  black_frame_ratio_max: 0.02
  frozen_run_s_max: 4.0
  av_sync_max_ms: 100
  require_decode_ok: true
novelty:
  lookback_videos: 60              # scene signatures / custom code compared against this window
  code_near_copy_jaccard: 0.6
preview:
  scale: 0.5
